name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release version and notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check version, changelog and package policy
        run: python tools/check_release.py
      - name: Match tag, crate version and release notes
        shell: python
        run: |
          import os, pathlib, re, tomllib
          package = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']
          tag = os.environ['GITHUB_REF_NAME']
          assert re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag), 'Invalid version tag'
          assert tag == 'v' + package['version'], 'Tag differs from Cargo.toml version'
          notes = pathlib.Path('docs/releases') / (tag + '.md')
          assert notes.is_file() and notes.read_text(encoding='utf-8').strip(), 'English release notes are required'
          assert pathlib.Path('.agents/skills').is_dir(), 'Agent Skills are required in the release'

  verified-ci:
    name: Verify exact main CI evidence and tested binaries
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.select.outputs.run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select successful main push CI for this exact commit
        id: select
        run: python tools/verify_release_ci.py --select
      - uses: actions/download-artifact@v4
        with:
          name: windows-exact-report
          path: verified-ci
          run-id: ${{ steps.select.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-exact-binaries
          path: verified-windows-binaries
          run-id: ${{ steps.select.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Fetch locked registry sources for independent inventory validation
        run: cargo fetch --locked
      - name: Validate all jobs, raw logs, source hashes and tested executable bytes
        run: python tools/verify_release_ci.py --run-id ${{ steps.select.outputs.run_id }} --evidence verified-ci --binaries verified-windows-binaries

  build:
    name: Package ${{ matrix.platform }}
    needs: verified-ci
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download the Windows executables exercised by the exact gate
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: windows-exact-binaries
          path: target/release
          run-id: ${{ needs.verified-ci.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download their original source and binary inventory
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: windows-exact-report
          path: verified-ci
          run-id: ${{ needs.verified-ci.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Build release binaries with MCP
        if: runner.os != 'Windows'
        run: cargo build --locked --release --features mcp --bins
      - name: Verify the published crate contents
        run: cargo package --locked --all-features
      - name: Verify that Windows packaging uses the exact tested executables
        if: runner.os == 'Windows'
        shell: python
        run: |
          import json, pathlib, sys
          sys.path.insert(0, 'tools')
          from runtime_profile import validate_binaries
          reports = list(pathlib.Path('verified-ci').rglob('report.json'))
          assert len(reports) == 1, 'Exactly one main CI source/binary inventory is required'
          validate_binaries(pathlib.Path('target/release'), json.loads(reports[0].read_text(encoding='utf-8')))
      - name: Bundle binaries, English documentation and Agent Skills
        shell: python
        env:
          ARTIFACT_PLATFORM: ${{ matrix.platform }}
        run: |
          import os, pathlib, shutil
          dest = pathlib.Path('release-dist')
          dest.mkdir()
          suffix = '.exe' if os.name == 'nt' else ''
          for name in ['wgc_geometry', 'wgc_gf', 'stkcraft-geocalc-mcp']:
              shutil.copy2(pathlib.Path('target/release') / (name + suffix), dest)
          for name in ['README.md', 'LICENSE', 'ATTRIBUTION.md', 'CHANGELOG.md']:
              shutil.copy2(name, dest)
          shutil.copytree('.agents/skills', dest / '.agents/skills')
          (dest / 'docs').mkdir()
          for guide in pathlib.Path('docs').glob('*.md'):
              shutil.copy2(guide, dest / 'docs')
          shutil.copytree('docs/reference', dest / 'docs/reference')
          (dest / 'docs/releases').mkdir()
          shutil.copy2(pathlib.Path('docs/releases') / (os.environ['GITHUB_REF_NAME'] + '.md'), dest / 'docs/releases')
          archive = 'stkcraft-geocalc-' + os.environ['GITHUB_REF_NAME'] + '-' + os.environ['ARTIFACT_PLATFORM']
          shutil.make_archive(archive, 'zip' if os.name == 'nt' else 'gztar', root_dir=dest)
      - name: Upload platform archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: stkcraft-geocalc-*
          if-no-files-found: error
      - name: Upload the verified crates.io package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-crate
          path: target/package/stkcraft-geocalc-*.crate
          if-no-files-found: error

  release:
    name: Publish GitHub release and checksums
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: stkcraft-geocalc ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: artifacts/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish verified crate to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download the exact verified package
        uses: actions/download-artifact@v4
        with:
          name: release-crate
          path: verified-package
      - name: Publish or verify an identical existing version
        shell: python
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          import hashlib, json, os, pathlib, subprocess, tomllib, urllib.error, urllib.request
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          package = pathlib.Path('verified-package') / ('stkcraft-geocalc-' + version + '.crate')
          expected = hashlib.sha256(package.read_bytes()).hexdigest()
          url = 'https://crates.io/api/v1/crates/stkcraft-geocalc/' + version
          request = urllib.request.Request(url, headers={'User-Agent': 'stkcraft-geocalc-release (https://github.com/spacelibres/STKCraft-Geocalc)'})
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              assert data['version']['checksum'] == expected, 'Existing crates.io version has different package bytes'
              print('The identical verified package is already published.')
              raise SystemExit(0)
          if not os.environ.get('CARGO_REGISTRY_TOKEN'):
              raise SystemExit('CARGO_REGISTRY_TOKEN is required for this unpublished version; crates.io publication was not performed.')
          subprocess.run(['cargo', 'package', '--locked', '--all-features'], check=True)
          rebuilt = pathlib.Path('target/package') / package.name
          assert hashlib.sha256(rebuilt.read_bytes()).hexdigest() == expected, 'Publish package differs from the verified release artifact'
          subprocess.run(['cargo', 'publish', '--locked', '--all-features'], check=True)
