name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  web-ui:
    name: Web workspace build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run build --prefix web
      - name: Test examples and result presentation
        run: node --test web/tests/examples.test.mjs web/tests/result-visualization.test.mjs web/tests/scene-snapshot.test.mjs
      - name: Test NASA comparison serialization
        run: python web/tests/test_nasa_compare.py

  portable-build:
    name: Build, docs and package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check release metadata
        run: python tools/check_release.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build all features and targets
        run: cargo build --locked --all-features --all-targets
      - name: Check Clippy warnings
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Build documentation
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify crate packaging
        run: cargo package --locked --all-features
      # Only the Windows job below runs the native exactness acceptance gate.
      # Successful portable builds do not establish bitwise numerical parity.

  msrv:
    name: MSRV 1.75
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.75.0
      - run: cargo check --locked --all-features --all-targets

  windows-exact:
    name: Windows pinned CSPICE exactness gate
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install the pinned native reference wheel
        run: 'python -m pip install --only-binary=:all: -r tools/requirements-reference.txt'
      - name: Fetch the locked registry dependencies
        run: cargo fetch --locked
      - name: Fetch and verify official pinned reference files
        run: python tools/bootstrap_reference.py
      - name: Run complete exact gate (all features, Debug and Release)
        run: python tools/verify_strict.py
      - name: Preserve the exact Windows binaries exercised by the Release tests
        uses: actions/upload-artifact@v4
        with:
          name: windows-exact-binaries
          path: |
            target/strict-verification/cargo/release/wgc_geometry.exe
            target/strict-verification/cargo/release/wgc_gf.exe
            target/strict-verification/cargo/release/stkcraft-geocalc-mcp.exe
          if-no-files-found: error
      - name: Preserve native gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-exact-report
          path: |
            target/bootstrap-report.json
            target/strict-verification/*.json
            target/strict-verification/*.log
          if-no-files-found: error
